# Container `web` do Compose de teste: o frontend (SPA) e, na mesma origem, a API e o canal
# do app. O app é alcançado pela faixa confiável (`proxy`), então o `X-Forwarded-For` montado
# aqui vale como o do Traefik: o IP simulado que o navegador do runner manda fica à esquerda.
server {
    listen 80;
    server_name web;
    server_tokens off;
    charset utf-8;

    root /srv/web;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass http://app-via-proxy:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Canal em tempo real (RF-RA004): websocket, com a origem do navegador repassada para o
    # `check_origin` do app.
    location /socket/ {
        proxy_pass http://app-via-proxy:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 1h;
    }

    # Rotas do React Router: qualquer caminho sem arquivo cai no index.html.
    location / {
        try_files $uri /index.html;
    }
}
