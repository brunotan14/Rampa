# Container `fixtures` do Compose de teste (PRD §11.1, RF-RA002). Única origem liberada pela
# `SSRF_ALLOWLIST`; escuta na 80, a porta que a proteção aceita.
#
#   /<nome>.html  páginas de `scanner/test/fixtures/` (as mesmas dos testes do scanner);
#   /ssrf/...     casos de SSRF do E2E (`e2e/integrado/fixtures/` e os redirecionamentos
#                 abaixo). Ficam fora de `scanner/test/fixtures/` porque apontam para
#                 endereços internos: abertas num navegador comum (nas demos), buscariam a
#                 rede de quem abriu.
server {
    listen 80;
    server_name fixtures;
    server_tokens off;
    charset utf-8;
    # `Location` relativo nos redirecionamentos internos: o host vem do pedido.
    absolute_redirect off;

    root /srv/fixtures;

    # Prontidão do container (healthcheck), fora do log.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Sem caminho: a página limpa.
    location = / {
        try_files /limpa.html =404;
    }

    # Só HTML: o resultado esperado de cada fixture (`.expected.json`) não é servido.
    location ~ \.html$ {
        try_files $uri =404;
    }

    # RF-RA002: redirecionamento para o loopback. O scanner bloqueia o salto e a página
    # é marcada com erro de acesso (`blocked_address`).
    location = /ssrf/redireciona-loopback {
        return 302 http://127.0.0.1/;
    }

    # RF-RA002: redirecionamento para o banco do Compose. Bloqueado pelo nome (sem ponto) e
    # pela rede (o scanner não tem rota para o `postgres`).
    location = /ssrf/redireciona-postgres {
        return 302 http://postgres/;
    }

    # Controle: redirecionamento dentro do `fixtures`, que a proteção deixa passar.
    location = /ssrf/redireciona-limpa {
        return 302 /limpa.html;
    }

    # Páginas de SSRF do E2E (`e2e/integrado/fixtures/`).
    location ^~ /ssrf/ {
        alias /srv/ssrf/;
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}
