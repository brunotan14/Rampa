# Container `fixtures` do Compose de teste (PRD §11.1, RF-RA002). Única origem liberada pela
# `SSRF_ALLOWLIST`; escuta na 80, a porta que a proteção aceita.
#
#   /<nome>.html  páginas de `scanner/test/fixtures/` (as mesmas dos testes do scanner);
#   /ssrf/...     casos de SSRF do E2E (`e2e/integrado/fixtures/` e os redirecionamentos
#                 abaixo). Ficam fora de `scanner/test/fixtures/` porque apontam para
#                 endereços internos: abertas num navegador comum (nas demos), buscariam a
#                 rede de quem abriu;
#   /painel, /restrito, /instavel/..., /sempre-503/...  barreira de login (RF-RA028) e falha
#                 de acesso (RF-RA029). As rotas com contador são do `fixtures-njs.js`.

# njs (módulo carregado no `nginx.conf` pelo `fixtures.Dockerfile`): contadores por caminho.
js_path "/etc/nginx/njs/";
js_import fixtures from fixtures-njs.js;
js_shared_dict_zone zone=hits:1m type=number;

server {
    listen 80;
    server_name fixtures;
    server_tokens off;
    charset utf-8;
    # `Location` relativo nos redirecionamentos internos: o host vem do pedido.
    absolute_redirect off;

    root /srv/fixtures;

    # Prontidão do container (healthcheck), fora do log.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Sem caminho: a página limpa.
    location = / {
        try_files /limpa.html =404;
    }

    # Só HTML: o resultado esperado de cada fixture (`.expected.json`) não é servido.
    location ~ \.html$ {
        try_files $uri =404;
    }

    # RF-RA002: redirecionamento para o loopback. O scanner bloqueia o salto e a página
    # é marcada com erro de acesso (`blocked_address`).
    location = /ssrf/redireciona-loopback {
        return 302 http://127.0.0.1/;
    }

    # RF-RA002: redirecionamento para o banco do Compose. Bloqueado pelo nome (sem ponto) e
    # pela rede (o scanner não tem rota para o `postgres`).
    location = /ssrf/redireciona-postgres {
        return 302 http://postgres/;
    }

    # Controle: redirecionamento dentro do `fixtures`, que a proteção deixa passar.
    location = /ssrf/redireciona-limpa {
        return 302 /limpa.html;
    }

    # RF-RA028: endereço que redireciona para uma tela com campo de senha visível.
    location = /painel {
        return 302 /entrar.html;
    }

    # RF-RA028 e RF-RA029: página que pede autenticação (401).
    location = /restrito {
        default_type text/html;
        add_header WWW-Authenticate 'Basic realm="fixtures"' always;
        return 401 '<!doctype html><html lang="pt-BR"><title>Entre</title><h1>Acesso restrito</h1></html>';
    }

    # RF-RA029: 503 e depois 200, e 503 sempre, com a contagem de pedidos em `/hits`. O UUID
    # do caminho separa os testes.
    location ~ "^/(instavel|sempre-503)/([0-9a-f-]{36})/hits$" {
        set $hit_key "$1:$2";
        js_content fixtures.hits;
    }

    location ~ "^/instavel/([0-9a-f-]{36})$" {
        set $hit_key "instavel:$1";
        js_content fixtures.unstable;
    }

    location ~ "^/sempre-503/([0-9a-f-]{36})$" {
        set $hit_key "sempre-503:$1";
        js_content fixtures.alwaysUnavailable;
    }

    # Páginas de SSRF do E2E (`e2e/integrado/fixtures/`).
    location ^~ /ssrf/ {
        alias /srv/ssrf/;
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}
