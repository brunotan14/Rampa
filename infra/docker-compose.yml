# Ambiente de desenvolvimento: banco e scanner em containers.
# O Phoenix e o Vite rodam na máquina (recarga automática); veja `make dev` na raiz.
name: rampa-dev

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [db]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 20

  scanner:
    build: ../scanner
    ports:
      - "127.0.0.1:4100:4100"
    networks: [scan]
    init: true
    shm_size: 1gb
    mem_limit: 1536m
    cpus: 1.5
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4100/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 20

# O scanner fica numa rede sem rota para o banco (PRD §7, RF-RA002).
networks:
  db:
  scan:

volumes:
  pgdata:
