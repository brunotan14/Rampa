name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Versões do Erlang/OTP e do Elixir, usadas no setup-beam e na chave do cache do Mix: mudar
# qualquer uma invalida o `_build` guardado, que não pode ser reaproveitado entre versões.
env:
  OTP_VERSION: "29.1"
  ELIXIR_VERSION: "1.20.5"

# Actions fixadas por SHA de commit (repositório público); a tag fica no comentário e o
# Dependabot (`.github/dependabot.yml`) propõe as atualizações.
jobs:
  backend:
    name: Backend (format, credo, ExUnit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MIX_ENV: test
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            backend/deps
            backend/_build
          key: mix-${{ runner.os }}-otp-${{ env.OTP_VERSION }}-elixir-${{ env.ELIXIR_VERSION }}-${{ hashFiles('backend/mix.lock') }}
      - run: mix deps.get
      - run: mix compile --warnings-as-errors
      - run: mix format --check-formatted
      - run: mix credo --strict
      - run: mix test
      # Contrato OpenAPI versionado: regenera e falha se `shared/openapi.json` estiver
      # desatualizado (rode `make openapi` e versione o arquivo).
      - name: Contrato OpenAPI atualizado
        working-directory: .
        run: |
          git ls-files --error-unmatch shared/openapi.json
          make openapi
          git diff --exit-code shared/openapi.json

  frontend:
    name: Frontend (lint, tipos, Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Mesma versão do Node em todo lugar: local, CI e imagem do scanner (ver `.nvmrc`).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  scanner:
    name: Scanner (lint, tipos, Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: scanner
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: scanner/package-lock.json
      - run: npm ci
      # Contrato do scanner: regenera os tipos a partir de `shared/scanner-contract.schema.json`
      # e falha se `scanner/src/contract.gen.ts` estiver desatualizado (rode
      # `make scanner-contract` e versione o arquivo).
      - name: Contrato do scanner atualizado
        working-directory: .
        run: |
          git ls-files --error-unmatch shared/scanner-contract.schema.json scanner/src/contract.gen.ts
          make scanner-contract
          git diff --exit-code scanner/src/contract.gen.ts
      - run: npx playwright install --with-deps chromium
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  e2e:
    name: E2E (Playwright + axe)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm ci
        working-directory: e2e
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - run: npm run typecheck
        working-directory: e2e
      - run: npx playwright test
        working-directory: e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 14
