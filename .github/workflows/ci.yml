name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Versões do Erlang/OTP e do Elixir, usadas no setup-beam e na chave do cache do Mix: mudar
# qualquer uma invalida o `_build` guardado, que não pode ser reaproveitado entre versões.
# As imagens de build e de runtime de `backend/Dockerfile` acompanham estas versões.
env:
  OTP_VERSION: "29.1"
  ELIXIR_VERSION: "1.20.5"

# Actions fixadas por SHA de commit (repositório público); a tag fica no comentário e o
# Dependabot (`.github/dependabot.yml`) propõe as atualizações.
jobs:
  backend:
    name: Backend (format, credo, ExUnit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MIX_ENV: test
    services:
      postgres:
        # Fixado por digest (a tag pode ser regravada); atualizar à mão junto com o Compose.
        image: postgres:17.11@sha256:ff87138949ad9a46f32ff23bd6852b52ce024a13dffe9b4087be98292cdd3b4f
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            backend/deps
            backend/_build
          key: mix-${{ runner.os }}-otp-${{ env.OTP_VERSION }}-elixir-${{ env.ELIXIR_VERSION }}-${{ hashFiles('backend/mix.lock') }}
      - run: mix deps.get
      - run: mix compile --warnings-as-errors
      - run: mix format --check-formatted
      - run: mix credo --strict
      - run: mix test
      # Contrato OpenAPI versionado: regenera e falha se `shared/openapi.json` estiver
      # desatualizado (rode `make openapi` e versione o arquivo). O mesmo script do `make ci`.
      - name: Contrato OpenAPI atualizado
        working-directory: .
        run: infra/ci/check-contract.sh openapi

  frontend:
    name: Frontend (lint, tipos, Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Mesma versão do Node em todo lugar: local, CI e imagem do scanner (ver `.nvmrc`).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  scanner:
    name: Scanner (lint, tipos, Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Roda dentro da imagem do Playwright, a mesma do scanner em produção (`scanner/Dockerfile`):
    # Chromium, fontes, bibliotecas do sistema e o Node do `.nvmrc` já vêm nela, sem `apt-get`
    # (a instalação pelo `--with-deps` dependia dos espelhos do Ubuntu e falhava junto com eles).
    # `scanner/test/toolchain.test.ts` garante que a tag acompanha o pacote `playwright`.
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble@sha256:6e3fb709361521eb27161606e6da6d2674e5e89fa16516cb37d6fdd91372273d
      options: --user 1001
    defaults:
      run:
        working-directory: scanner
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: scanner/package-lock.json
      - run: npm ci
      # Contrato do scanner: regenera os tipos a partir de `shared/scanner-contract.schema.json`
      # e falha se `scanner/src/contract.gen.ts` estiver desatualizado (rode
      # `make scanner-contract` e versione o arquivo). O mesmo script do `make ci`.
      - name: Contrato do scanner atualizado
        working-directory: .
        run: infra/ci/check-contract.sh scanner
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  e2e:
    name: E2E (Playwright + axe)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Roda dentro da imagem do Playwright, a mesma do scanner em produção (`scanner/Dockerfile`):
    # Chromium, fontes, bibliotecas do sistema e o Node do `.nvmrc` já vêm nela, sem `apt-get`
    # (a instalação pelo `--with-deps` dependia dos espelhos do Ubuntu e falhava junto com eles).
    # A tag acompanha o `@playwright/test` do `e2e/package.json` (a mesma versão do scanner).
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble@sha256:6e3fb709361521eb27161606e6da6d2674e5e89fa16516cb37d6fdd91372273d
      options: --user 1001
    needs: [frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm ci
        working-directory: e2e
      - run: npm run typecheck
        working-directory: e2e
      - run: npx playwright test
        working-directory: e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 14

  # E2E integrado (PRD §11.4): Compose de teste (`infra/docker-compose.test.yml`) com a release
  # do app, o scanner real, o banco e o site de fixtures, e os specs de `e2e/integrado/`.
  # Roda direto no runner, sem `container:`, porque usa o Docker dele. O mesmo script do
  # `make e2e-integrado` local: constrói as imagens, prova que a release de produção recusa a
  # SSRF_ALLOWLIST, confere o isolamento de rede do scanner e roda o Playwright.
  # Sem cache de build entre execuções: com o driver `docker` do runner não há exportação de
  # cache, e o driver `docker-container` exigiria a imagem do BuildKit e o `--load` de imagens
  # de mais de 1 GB, que custam mais do que a compilação que economizariam.
  e2e-integrated:
    name: E2E integrado (API + scanner)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compose de teste e specs integrados
        run: make e2e-integrado
      # O script já derruba tudo; este passo cobre o cancelamento e o prazo estourado (guarda
      # os logs se os containers ainda existirem).
      - name: Derruba o Compose de teste
        if: always()
        run: infra/test/run-e2e.sh down
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure() || cancelled()
        with:
          name: e2e-integrado
          path: e2e/test-results/integrado
          retention-days: 14

  # Barra no PR dependência nova (npm, mix, actions) com vulnerabilidade conhecida de severidade
  # moderada ou maior. Só faz sentido em PR: compara a base com a branch.
  dependency-review:
    name: Revisão de dependências
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
