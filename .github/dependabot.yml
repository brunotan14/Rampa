# Atualizações automáticas de dependências (repositório público: cadeia de suprimentos).
#
# Regras:
# - Uma vez por semana. Em cada ecossistema, minor e patch chegam juntas num PR agrupado;
#   cada major chega num PR próprio, para uma falha na CI apontar qual atualização quebrou.
# - `@types/node` não sobe de major sozinho: ele acompanha a major do Node, que é decidida pela
#   imagem do scanner (`.nvmrc`).
# - As imagens Docker não são atualizadas aqui (sem ecossistema `docker`): as do backend
#   (`backend/Dockerfile`, acompanham `OTP_VERSION` e `ELIXIR_VERSION` do `ci.yml`), a do
#   `fixtures` (`infra/test/fixtures.Dockerfile`) e a do PostgreSQL sobem à mão, com o digest
#   conferido por `docker buildx imagetools inspect <tag>`.
# - A imagem do Playwright não é atualizada aqui, e os pacotes que a acompanham são ignorados
#   (`playwright` no scanner, `@playwright/test` no e2e): sobem juntos, à mão, porque
#   `scanner/test/toolchain.test.ts` falha se divergirem.
#
# Para subir o Playwright (um PR só):
# 1. Troque a tag e o digest (`docker buildx imagetools inspect <imagem>`) em `scanner/Dockerfile`,
#    `e2e/Dockerfile` e nos dois `container.image` de `.github/workflows/ci.yml`.
# 2. Suba o `playwright` do scanner e o `@playwright/test` do e2e para a versão da tag:
#    `npm install --prefix scanner playwright@<versão> --save-exact` e
#    `npm install --prefix e2e @playwright/test@<versão> --save-exact`.
# 3. Confira o Node da imagem: `docker run --rm <imagem> node --version`.
# 4. Atualize a linha `# Node da imagem:` do `scanner/Dockerfile` e o `.nvmrc` com essa versão.
# 5. Se a major do Node mudar, suba junto o `@types/node` (`--save-exact`) e o `engines` de
#    frontend, scanner e e2e.
# 6. Rode `make test` (o `toolchain.test.ts` confere tudo isso) e `make e2e-integrado`.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # 1 PR agrupado + até 4 majors separadas.
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "Dependências (actions)"

  - package-ecosystem: npm
    directories:
      - /frontend
      - /e2e
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-frontend-e2e-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # Sobe junto com a imagem do Playwright, à mão (ver o topo deste arquivo).
      - dependency-name: "@playwright/test"
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # eslint-plugin-jsx-a11y 6.10.2 (lint de acessibilidade do frontend) ainda não aceita o
      # ESLint 10. Tirar estas duas regras quando o plugin aceitar; eslint e @eslint/js sobem juntos.
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
      # typescript-eslint 8.72 aceita só TypeScript < 6.1. Tirar quando ele aceitar versões novas.
      - dependency-name: typescript
        versions: [">=6.1.0"]
    commit-message:
      prefix: "Dependências (npm)"

  - package-ecosystem: npm
    directory: /scanner
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-scanner-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # Sobe junto com a imagem do Playwright, à mão (ver o topo deste arquivo).
      - dependency-name: playwright
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # typescript-eslint 8.72 aceita só TypeScript < 6.1. Tirar quando ele aceitar versões novas.
      - dependency-name: typescript
        versions: [">=6.1.0"]
    commit-message:
      prefix: "Dependências (npm, scanner)"

  - package-ecosystem: mix
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      mix-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "Dependências (mix)"
