# Atualizações automáticas de dependências (repositório público: cadeia de suprimentos).
# Uma vez por semana, um PR agrupado por ecossistema, com poucos PRs abertos ao mesmo tempo.
# A tag da imagem do Playwright (docker) e o pacote `playwright` (npm) precisam subir juntos:
# `scanner/test/toolchain.test.ts` falha se divergirem, e o Node da imagem tem de bater com o `.nvmrc`.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: "Dependências (actions)"

  - package-ecosystem: npm
    directories:
      - /frontend
      - /scanner
      - /e2e
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      npm:
        patterns: ["*"]
    commit-message:
      prefix: "Dependências (npm)"

  - package-ecosystem: mix
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      mix:
        patterns: ["*"]
    commit-message:
      prefix: "Dependências (mix)"

  - package-ecosystem: docker
    directory: /scanner
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      docker:
        patterns: ["*"]
    commit-message:
      prefix: "Dependências (docker)"
