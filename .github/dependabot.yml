# Atualizações automáticas de dependências (repositório público: cadeia de suprimentos).
#
# Regras:
# - Uma vez por semana. Em cada ecossistema, minor e patch chegam juntas num PR agrupado;
#   cada major chega num PR próprio, para uma falha na CI apontar qual atualização quebrou.
# - `@types/node` não sobe de major sozinho: ele acompanha a major do Node, que é decidida pela
#   imagem do scanner (`.nvmrc`).
# - A imagem do Playwright não é atualizada aqui (sem ecossistema `docker`) e o pacote
#   `playwright` é ignorado no scanner: os dois sobem juntos, à mão, porque
#   `scanner/test/toolchain.test.ts` falha se divergirem.
#
# Para subir o Playwright (um PR só):
# 1. Troque a tag em `scanner/Dockerfile` e o `playwright` em `scanner/package.json`
#    (`npm install --prefix scanner playwright@<versão> --save-exact`).
# 2. Confira o Node da imagem: `docker run --rm <imagem> node --version`.
# 3. Atualize a linha `# Node da imagem:` do Dockerfile e o `.nvmrc` com essa versão.
# 4. Se a major do Node mudar, suba junto o `@types/node` e o `engines` de frontend, scanner e e2e.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # 1 PR agrupado + até 4 majors separadas.
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "Dependências (actions)"

  - package-ecosystem: npm
    directories:
      - /frontend
      - /e2e
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-frontend-e2e-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "Dependências (npm)"

  - package-ecosystem: npm
    directory: /scanner
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-scanner-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # Sobe junto com a imagem do Playwright, à mão (ver o topo deste arquivo).
      - dependency-name: playwright
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "Dependências (npm, scanner)"

  - package-ecosystem: mix
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      mix-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "Dependências (mix)"
